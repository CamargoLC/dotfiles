[colors]
background = #1d2021
foreground = #ebdbb2
accent     = #b8bb26
gray       = #555555

[bar/main]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}

# A espessura da linha de destaque inferior (underline)
line-size = 2

# O novo separador físico entre os módulos (um traço sutil)
separator = " | "
separator-foreground = ${colors.gray}

# A fonte Hack Nerd Font que configuramos no sistema
font-0 = "Hack Nerd Font:size=11;2"

# Os únicos módulos que importam, como você pediu
modules-left = bspwm
modules-center = xwindow
modules-right = pulseaudio date tray

# Sem bordas para um visual mais limpo que não brigue com as janelas
border-size = 0

[module/bspwm]
type = internal/bspwm

# Área de trabalho focada: Texto verde, fundo escuro, com sublinhado verde
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.background}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

# Área de trabalho ocupada: Texto claro normal
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

# Área de trabalho vazia: Cinza escuro discreto
label-empty = %name%
label-empty-foreground = ${colors.gray}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
# Corta o título da janela se passar de 60 caracteres (igual à sua print)
label = %title:0:60:...%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume>
label-volume = %percentage%%

label-muted =  Muted
label-muted-foreground = ${colors.gray}

# Os ícones mudam conforme o volume sobe
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent}

# Abre o controle de volume ao clicar com botão direito
click-right = pavucontrol

[module/date]
type = internal/date
interval = 5

# O formato exato de relógio da sua print
date = " %d %b, %Y, %a"
time = "%R"

label = %date% - %time%
label-foreground = ${colors.accent}

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-background = ${colors.background}
